name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -e ".[dev]"
      - name: unit tests + offline replay of the recorded real-model runs
        run: pytest -q -rs
  live-tiny-model:
    # Runs a slice of the harness against a REAL model: Qwen2.5-0.5B-Instruct (Q4_K_M GGUF)
    # served by llama.cpp's llama-server on the CI runner's CPU.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: fetch llama.cpp + model
        run: |
          mkdir -p models
          curl -sL https://github.com/ggml-org/llama.cpp/releases/download/b11552/llama-b11552-bin-ubuntu-x64.tar.gz | tar xz -C models
          curl -sL -o models/q.gguf https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
      - name: run 1 task per category
        run: |
          LS=$(find models -name llama-server | head -1)
          $LS -m models/q.gguf --port 8091 -c 8192 --jinja --no-webui > server.log 2>&1 &
          for i in $(seq 120); do curl -sf localhost:8091/health && break; sleep 1; done
          python -m ahb.bench --base-url http://127.0.0.1:8091 --model qwen2.5-0.5b-ci --limit 1 --no-cache-exp --out ci-live.json
      - uses: actions/upload-artifact@v4
        with: {name: ci-live, path: ci-live.json}
